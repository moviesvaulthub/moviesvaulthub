<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoviesVault — Download Movies Free</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0c10;
      color: #e8ecf0;
    }

    /* Top Bar */
    .topbar {
      background: #e63946;
      text-align: center;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    /* Navigation */
    nav {
      background: #13161d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      border-bottom: 1px solid #252a36;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #e63946;
      text-decoration: none;
    }

    .nav-links a {
      color: #7a8394;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    .nav-links a.active {
      color: #e63946;
    }

    /* Movie Grid */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 24px;
      padding: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .movie-card {
      background: #1a1e28;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #252a36;
    }

    .movie-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border-color: #e63946;
    }

    .movie-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .movie-year {
      font-size: 12px;
      color: #7a8394;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #13161d;
      max-width: 400px;
      width: 90%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e63946;
    }

    .modal-header {
      padding: 16px;
      background: #1a1e28;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #252a36;
    }

    .modal-header h3 {
      color: #e63946;
    }

    .modal-body {
      padding: 20px;
      text-align: center;
    }

    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .download-btn {
      display: inline-block;
      background: #e63946;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    .download-btn:hover {
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #7a8394;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #252a36;
      border-top-color: #e63946;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .section-title {
      font-size: 24px;
      margin: 20px 0 0 30px;
      color: #e63946;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #7a8394;
      font-size: 12px;
      border-top: 1px solid #252a36;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .movies-grid {
        gap: 15px;
        padding: 15px;
      }
      .nav-links a {
        margin-left: 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="topbar">🔥 MoviesVault — Free Movie Downloads — Updated Daily</div>

<nav>
  <a class="logo" href="#" onclick="showPage('home')">MoviesVault</a>
  <div class="nav-links">
    <a id="nav-home" class="active" onclick="showPage('home')">Home</a>
    <a id="nav-popular" onclick="showPage('popular')">Popular</a>
  </div>
</nav>

<!-- HOME PAGE -->
<div id="page-home" class="page active">
  <div class="section-title">🔥 Latest Movies</div>
  <div id="latest-grid" class="movies-grid">
    <div class="loading"><div class="spinner"></div>Loading movies...</div>
  </div>
</div>

<!-- POPULAR PAGE -->
<div id="page-popular" class="page">
  <div class="section-title">⭐ Popular Movies</div>
  <div id="popular-grid" class="movies-grid">
    <div class="loading"><div class="spinner"></div>Loading movies...</div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Movie Title</h3>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="loading"><div class="spinner"></div>Loading download link...</div>
    </div>
  </div>
</div>

<footer>
  <p>© 2025 MoviesVault — For educational purposes only. All trademarks belong to their respective owners.</p>
</footer>

<script>
  // ========== TMDB API CONFIGURATION ==========
  const API_KEY = '8265bd1679663a7ea12ac168da84d2e8';
  const BASE_URL = 'https://api.themoviedb.org/3';
  const IMG_URL = 'https://image.tmdb.org/t/p/w300';

  // ========== MOVIE DATABASE (Fallback) ==========
  // If you want to be 100% independent of APIs, you can hardcode movies here
  // This is also useful for movies that might not be found in YTS
  const FALLBACK_MOVIES = {
    "Avengers: Endgame": "https://yts.mx/movies/avengers-endgame-2019",
    "Joker": "https://yts.mx/movies/joker-2019",
    "The Batman": "https://yts.mx/movies/the-batman-2022",
    "Oppenheimer": "https://yts.mx/movies/oppenheimer-2023",
    "John Wick: Chapter 4": "https://yts.mx/movies/john-wick-chapter-4-2023",
    "Dune: Part Two": "https://yts.mx/movies/dune-part-two-2024",
    "Inside Out 2": "https://yts.mx/movies/inside-out-2-2024",
    "Deadpool 3": "https://yts.mx/movies/deadpool-3-2024",
    "Beetlejuice Beetlejuice": "https://yts.mx/movies/beetlejuice-beetlejuice-2024",
    "Gladiator II": "https://yts.mx/movies/gladiator-ii-2024"
  };

  // ========== HELPER FUNCTIONS ==========
  function showPage(pageName) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(`page-${pageName}`).classList.add('active');
    
    // Update active nav link
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    document.getElementById(`nav-${pageName}`).classList.add('active');
    
    // Load content if needed
    if (pageName === 'popular') {
      loadPopularMovies();
    } else if (pageName === 'home') {
      loadLatestMovies();
    }
  }

  // Function to generate a clean movie title for YTS URL
  function slugifyMovieTitle(title) {
    return title.toLowerCase()
      .replace(/[^\w\s-]/g, '')      // Remove special characters
      .replace(/\s+/g, '-')           // Replace spaces with hyphens
      .replace(/-+/g, '-');           // Remove duplicate hyphens
  }

  // Get download link for a movie (returns YTS URL)
  async function getDownloadLink(movieTitle, movieYear) {
    try {
      // First, check if we have a manual fallback
      if (FALLBACK_MOVIES[movieTitle]) {
        return FALLBACK_MOVIES[movieTitle];
      }
      
      // Try to search YTS via their API
      const searchQuery = encodeURIComponent(`${movieTitle} ${movieYear || ''}`);
      const ytsApiUrl = `https://yts.mx/api/v2/list_movies.json?query_term=${searchQuery}&limit=1`;
      
      const response = await fetch(ytsApiUrl);
      const data = await response.json();
      
      if (data.data && data.data.movies && data.data.movies.length > 0) {
        const movie = data.data.movies[0];
        const ytsUrl = `https://yts.mx/movies/${movie.slug || slugifyMovieTitle(movie.title)}`;
        return ytsUrl;
      }
    } catch (error) {
      console.log('YTS API error, using fallback');
    }
    
    // Ultimate fallback: Try to construct a URL based on the title
    const slug = slugifyMovieTitle(movieTitle);
    return `https://yts.mx/movies/${slug}`;
  }

  // Open modal with download link
  async function openMovieModal(title, year, poster) {
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    
    modalTitle.textContent = title;
    modalBody.innerHTML = '<div class="loading"><div class="spinner"></div>Finding download link...</div>';
    modal.classList.add('active');
    
    // Get the download link
    const downloadUrl = await getDownloadLink(title, year);
    
    // Display the link
    modalBody.innerHTML = `
      <img src="${poster}" style="width: 120px; border-radius: 8px; margin-bottom: 16px;" 
           onerror="this.style.display='none'">
      <p style="margin: 10px 0;">Click the button below to download <strong>${title}</strong> from YTS.</p>
      <a href="${downloadUrl}" target="_blank" class="download-btn">⬇ Download from YTS</a>
      <p style="margin-top: 16px; font-size: 12px; color: #7a8394;">
        You will be redirected to YTS (YIFY) – a trusted source for movie torrents.
      </p>
    `;
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  // Render movie grid
  function renderMovies(containerId, movies) {
    const container = document.getElementById(containerId);
    if (!movies || movies.length === 0) {
      container.innerHTML = '<div class="loading">No movies found.</div>';
      return;
    }
    
    container.innerHTML = movies.map(movie => `
      <div class="movie-card" onclick='openMovieModal("${movie.title.replace(/'/g, "\\'")}", "${movie.year}", "${movie.poster || ''}")'>
        <img src="${movie.poster || 'https://placehold.co/300x450/1a1e28/e63946?text=No+Image'}" 
             alt="${movie.title}"
             onerror="this.src='https://placehold.co/300x450/1a1e28/e63946?text=No+Image'">
        <div class="movie-info">
          <div class="movie-title">${movie.title}</div>
          <div class="movie-year">${movie.year}</div>
        </div>
      </div>
    `).join('');
  }

  // Load latest movies from TMDB
  async function loadLatestMovies() {
    try {
      const response = await fetch(`${BASE_URL}/movie/now_playing?api_key=${API_KEY}&language=en-US&page=1`);
      const data = await response.json();
      
      const movies = data.results.map(movie => ({
        id: movie.id,
        title: movie.title,
        year: movie.release_date ? movie.release_date.split('-')[0] : 'N/A',
        poster: movie.poster_path ? IMG_URL + movie.poster_path : null
      }));
      
      renderMovies('latest-grid', movies);
    } catch (error) {
      console.error('Error loading latest movies:', error);
      document.getElementById('latest-grid').innerHTML = '<div class="loading">Failed to load movies. Please refresh.</div>';
    }
  }

  // Load popular movies from TMDB
  async function loadPopularMovies() {
    try {
      const response = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}&language=en-US&page=1`);
      const data = await response.json();
      
      const movies = data.results.map(movie => ({
        id: movie.id,
        title: movie.title,
        year: movie.release_date ? movie.release_date.split('-')[0] : 'N/A',
        poster: movie.poster_path ? IMG_URL + movie.poster_path : null
      }));
      
      renderMovies('popular-grid', movies);
    } catch (error) {
      console.error('Error loading popular movies:', error);
      document.getElementById('popular-grid').innerHTML = '<div class="loading">Failed to load movies. Please refresh.</div>';
    }
  }

  // Initialize the page
  loadLatestMovies();
  showPage('home');
</script>
</body>
</html>
