    .thin-sb::-webkit-scrollbar-track { background: transparent; }
    .thin-sb::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Hero carousel */
    .hero-track { display:flex; transition: transform 0.65s cubic-bezier(0.25,0.46,0.45,0.94); }

    /* Movie card */
    .mcard:hover .mcard-overlay { opacity: 1; }
    .mcard:hover .mcard-play   { transform: translateY(0); }
    .mcard:hover .mcard-img    { transform: scale(1.1); }
    .mcard-overlay { opacity:0; transition: opacity 0.3s; }
    .mcard-img     { transition: transform 0.5s; }
    .mcard-play    { transform: translateY(16px); transition: transform 0.3s; }

    /* Modal */
    @keyframes fadeIn  { from{opacity:0}           to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
    .modal-bd   { animation: fadeIn  0.2s ease; }
    .modal-box  { animation: slideUp 0.3s ease; }

    /* Spinner */
    @keyframes spin { to{ transform:rotate(360deg) } }
    .spinner { animation: spin 1s linear infinite; }

    /* Download card hover sweep */
    .dlcard { position: relative; overflow: hidden; }
    .dlcard::before { content:''; position:absolute; inset:0; background:rgba(230,57,70,0.05); transform:translateY(101%); transition:transform 0.28s ease-out; border-radius: inherit; pointer-events:none; }

    /* Genre cards */
    .genre-card:hover .genre-icon { transform: scale(1.15); }

    /* Tab underline */
    .modal-tab.active    { color:var(--primary); border-bottom-color:var(--primary); }
    .modal-tab           { border-bottom: 2px solid transparent; }
  </style>
</head>

<script>
// ───────────────────────────────────────────────────────────────
// CONFIG
// ───────────────────────────────────────────────────────────────
const TMDB_KEY  = '8265bd1679663a7ea12ac168da84d2e8';
const TMDB      = 'https://api.themoviedb.org/3';
const IMG_P     = 'https://image.tmdb.org/t/p/w300';
const IMG_B     = 'https://image.tmdb.org/t/p/w780';
// API base: pointed at the Replit backend.
window.MV_API = 'https://interface-enhancer--moviesvault001.replit.app/api';

const MOVIES = new Map();
function reg(m) { if (m?.id) MOVIES.set(m.id, m); return m; }
function openById(id) { const m = MOVIES.get(+id); if (m) openModal(m); }

// ───────────────────────────────────────────────────────────────
// CACHE + FETCH
// ───────────────────────────────────────────────────────────────
const CACHE = new Map();
function tmdb(path, params = {}) {
  const u = new URL(`${TMDB}${path}`);
  u.searchParams.set('api_key', TMDB_KEY);
  for (const [k,v] of Object.entries(params)) if (v !== undefined && v !== '') u.searchParams.set(k, String(v));
  const key = u.toString();
  if (!CACHE.has(key)) CACHE.set(key, fetch(key).then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); }));
  return CACHE.get(key);
}

const DL_CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours
function dlCacheGet(key) {
  try {
    const raw = localStorage.getItem('mv_dlcache_' + key);
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > DL_CACHE_TTL) { localStorage.removeItem('mv_dlcache_' + key); return null; }
    return data;
  } catch { return null; }
}
function dlCacheSet(key, data) {
  try { localStorage.setItem('mv_dlcache_' + key, JSON.stringify({ data, ts: Date.now() })); } catch {}
}
async function extractLinks(title, year, timeoutMs=7000) {
  const cacheKey = `${(title||'').toLowerCase().trim()}|${year||''}`;
  const cached = dlCacheGet(cacheKey);
  if (cached) return cached;
  const u = new URL(`${API_BASE}/downloads/extract`, location.origin.startsWith('file') ? 'http://localhost' : location.origin);
  if (title) u.searchParams.set('title', title);
  if (year)  u.searchParams.set('year', year);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const r = await fetch(u.toString(), { signal: controller.signal });
    if (!r.ok) throw new Error(r.statusText);
    const data = await r.json();
    if (data?.links?.length) dlCacheSet(cacheKey, data); // only cache real hits, never cache "not found"
    return data;
  } finally {
    clearTimeout(timer);
  }
}

function renderSearchResultsHTML() {

}
function drawSearchResults() {

function doSearch(q) {
  clearTimeout(_st);
  if (_searchAbort) { _searchAbort.abort(); _searchAbort = null; }
  if (!q || q.length < 3) { _sr = []; _searching = false; drawSearchResults(); return; }
  _searching = true; drawSearchResults();
  _st = setTimeout(async () => {
    const myQuery = q;
    _searchAbort = new AbortController();
    try {
      const u = new URL(`${TMDB}/search/multi`);
      u.searchParams.set('api_key', TMDB_KEY);
      u.searchParams.set('query', myQuery);
      u.searchParams.set('include_adult', 'false');
      const r = await fetch(u, { signal: _searchAbort.signal });
      const d = await r.json();
      if (S.searchQ !== myQuery) return; // a newer keystroke superseded this request
      _sr = (d.results||[]).slice(0,6).map(reg);
      _searching = false;
      drawSearchResults();
    } catch (err) {
      if (err.name === 'AbortError') return; // superseded, ignore
      _sr = []; _searching = false; drawSearchResults();
    }
  }, 200);
}

async function prefetchDL(m) {
  // Quiet, single-attempt background fetch so the Download tab feels instant if it's ready in time.
  // Does not retry and never shows loading UI — the real fetchDL() with retries still runs if the user opens the tab.
  const title = m.title || m.name || '';
  const year  = (m.release_date||m.first_air_date||'').split('-')[0];
  if (!title) return;
  try {
    const result = await extractLinks(title, year);
    if (S.modal?.id === m.id && !S.dlResult && !S.dlLoading) S.dlResult = result;
    if (S.modal?.id === m.id && S.modalTab === 'download') drawModal();
  } catch {} // silent — the real download tab will handle retries if needed
}

async function fetchDL() {
  if (!S.modal) return;
  S.dlLoading = true; S.dlWaking = false; drawModal();
  const title = S.dlCommitted || S.modal.title || S.modal.name || '';
  const year  = (S.modal.release_date||S.modal.first_air_date||'').split('-')[0];
  const modalId = S.modal.id;
  const attempts = [0, 1500, 3000, 5000]; // each attempt times out at 7s internally; short gaps between fresh tries
  for (let i = 0; i < attempts.length; i++) {
    if (attempts[i]) {
      S.dlWaking = true; drawModal();
      await new Promise(res => setTimeout(res, attempts[i]));
      if (!S.modal || S.modal.id !== modalId) return; // user moved on
    }
    try {
      const result = await extractLinks(title, year);
      if (!S.modal || S.modal.id !== modalId) return;
      S.dlResult = result; S.dlLoading = false; S.dlWaking = false; drawModal();
      return;
    } catch {
      if (i === attempts.length - 1) {
        if (!S.modal || S.modal.id !== modalId) return;
        S.dlResult = { links:[], found:false };
        S.dlLoading = false; S.dlWaking = false; drawModal();
      }
    }
  }
}

function retryDL()   { S.dlResult=null; fetchDL(); }
function commitDL()  { S.dlCommitted = S.dlInput.trim() || (S.modal?.title||S.modal?.name||''); S.dlResult=null; fetchDL(); }

  const grid = document.getElementById('cat-grid'); if (!grid) return;
  grid.innerHTML = skels(18);

  let data;
  if (cfg.query) {
    data = await tmdb('/search/multi', { query: cfg.query, include_adult:'false' });
  } else {
    const p = { page: String(S.catPage) };
    const t = S.catTab;
    if (cfg.language && !['korean','chinese','thai'].includes(t)) p.with_original_language = cfg.language;

    if (cfg.originCountry) p.with_origin_country = cfg.originCountry;
    if (t==='popular')  p.sort_by = 'popularity.desc';
    if (t==='new')    { p.sort_by = 'primary_release_date.desc'; p['primary_release_date.lte'] = new Date().toISOString().split('T')[0]; }
    if (t==='top')    { p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = cfg.originCountry ? '20' : '100'; }
    if (t==='action')   p.with_genres = '10759';
    if (t==='comedy')   p.with_genres = '35';
    if (t==='drama')    p.with_genres = '18';
    if (t==='korean')   p.with_original_language = 'ko';
    if (t==='chinese')  p.with_original_language = 'zh';
    if (t==='thai')     p.with_original_language = 'th';
    if (cfg.genreId)    { p.with_genres = cfg.genreId; p.sort_by = 'popularity.desc'; }
    if (S.catYear) {
      if (cfg.type === 'tv') p.first_air_date_year = S.catYear;
      else p.primary_release_year = S.catYear;
    }
    data = await tmdb(`/discover/${cfg.type}`, p);
  }

  S.catData = data;
  const results = (data?.results||[]).map(reg);
  if (!grid) return;
  grid.innerHTML = results.length ? results.map(m=>card(m)).join('') : '<div class="col-span-full text-center py-20 text-gray-400">No titles found.</div>';

  const pag = document.getElementById('cat-pag');
  if (data?.total_pages > 1 && !cfg.query) {
    pag?.classList.remove('hidden');
    pag?.classList.add('flex');
    const max = Math.min(data.total_pages, 500);
    const info = document.getElementById('cat-pg-info'); if (info) info.textContent = `Page ${S.catPage} of ${max}`;
    const prev = document.getElementById('cat-prev'); if (prev) prev.disabled = S.catPage===1;
    const next = document.getElementById('cat-next'); if (next) next.disabled = S.catPage>=max;
  } else {
    pag?.classList.add('hidden');
  }
}

function setCatTab(t) {
  S.catTab = t; S.catPage = 1;
  document.querySelectorAll('.cat-tab').forEach(b=>{
    const a = b.dataset.tab===t;
    b.style.background = a ? '#e63946' : 'rgba(255,255,255,0.1)';
    b.style.color = a ? '#fff' : 'rgba(255,255,255,0.7)';
  });
  loadCat();
}
function setCatYear(y) { S.catYear = y; S.catPage = 1; loadCat(); }

function doCatPage(dir) {
  const max = Math.min(S.catData?.total_pages||1, 500);
  S.catPage = Math.max(1, Math.min(max, S.catPage+dir));
  loadCat(); window.scrollTo(0,0);
}

// ───────────────────────────────────────────────────────────────
// PWA INSTALL
// ───────────────────────────────────────────────────────────────
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  renderInstallArea();
});
window.addEventListener('appinstalled', () => { _deferredInstallPrompt = null; renderInstallArea(); });

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function installDismissed() { return localStorage.getItem('mv_install_dismissed') === '1'; }
function dismissInstallBanner() {
  localStorage.setItem('mv_install_dismissed', '1');
  const el = document.getElementById('install-banner');
  if (el) el.remove();
}

function renderInstallArea() {
  if (isStandalone() || installDismissed()) return;
  if (document.getElementById('install-banner')) return;
  let html = '';
  if (_deferredInstallPrompt) {
    html = `
      <div id="install-banner" class="fixed bottom-20 md:bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 z-[60] rounded-xl shadow-2xl border border-white/10 p-4 flex items-center gap-3" style="background:#12151b">
        <div class="bg-[#e63946] w-10 h-10 rounded-lg flex-shrink-0 flex items-center justify-center font-bebas text-white text-lg">MV</div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-bold">Install MoviesVault</p>
          <p class="text-white/50 text-xs">Add to your home screen for quick access</p>
        </div>
        <button onclick="installApp()" class="font-bebas text-sm px-4 py-2 rounded text-white flex-shrink-0" style="background:#e63946">INSTALL</button>
        <button onclick="dismissInstallBanner()" class="text-white/30 hover:text-white/60 flex-shrink-0 w-6 h-6 flex items-center justify-center">${ICO.x}</button>
      </div>`;
  } else if (isIOS()) {
    html = `
      <div id="install-banner" class="fixed bottom-20 md:bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 z-[60] rounded-xl shadow-2xl border border-white/10 p-4 flex items-center gap-3" style="background:#12151b">
        <div class="bg-[#e63946] w-10 h-10 rounded-lg flex-shrink-0 flex items-center justify-center font-bebas text-white text-lg">MV</div>
        <div class="flex-1 min-w-0">
          <p class="text-white text-sm font-bold">Install MoviesVault</p>
          <p class="text-white/50 text-xs">Tap Share, then "Add to Home Screen"</p>
        </div>
        <button onclick="dismissInstallBanner()" class="text-white/30 hover:text-white/60 flex-shrink-0 w-6 h-6 flex items-center justify-center">${ICO.x}</button>
      </div>`;
  }
  if (html) document.body.insertAdjacentHTML('beforeend', html);
}
async function installApp() {
  if (!_deferredInstallPrompt) return;
  _deferredInstallPrompt.prompt();
  await _deferredInstallPrompt.userChoice;
  _deferredInstallPrompt = null;
  const el = document.getElementById('install-banner');
  if (el) el.remove();
}

// ───────────────────────────────────────────────────────────────
// GLOBAL ACTIONS
// ───────────────────────────────────────────────────────────────
function toggleSearch() {
  S.searchOpen = !S.searchOpen;
  if (!S.searchOpen) { S.searchQ = ''; _sr = []; }
  drawNav();
}
function toggleMobile() { S.mobileOpen = !S.mobileOpen; drawNav(); }

// Close search/menu when clicking outside navbar
document.addEventListener('click', e => {
  const path = e.composedPath ? e.composedPath() : [];
  const insideNav = path.some(el => el.id === 'nav-wrap');
  if (!insideNav && S.searchOpen) {
    S.searchOpen = false; S.searchQ = ''; _sr = [];
    drawNav();
  }
  if (!insideNav && S.mobileOpen) {
    S.mobileOpen = false; drawNav();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modal) closeModal();
    else if (S.searchOpen) { S.searchOpen=false; S.searchQ=''; _sr=[]; drawNav(); }
  }
});

window.addEventListener('scroll', () => {
  const sc = window.scrollY > 50;
  if (sc !== S.scrolled) { S.scrolled = sc; drawNav(); }
});

// ───────────────────────────────────────────────────────────────
// EXPOSE GLOBALS (used from inline onclick)
// ───────────────────────────────────────────────────────────────
Object.assign(window, {
  openById, openModal, closeModal, setTab, handleWL, retryDL, commitDL,
  toggleSearch, toggleMobile, heroGo, heroNav,
  setTrendTab, setCatTab, doCatPage,
  S, // for dl input oninput
});

// ───────────────────────────────────────────────────────────────
// RENDER ENGINE
// ───────────────────────────────────────────────────────────────
function renderPage() {
  clearInterval(S.heroTimer);
  drawNav();
  renderFooter();
  const p = S.page;
  if (p === 'home')   renderHome();
  else if (p === 'about') renderAbout();
  else if (p === 'privacy') renderPrivacy();
  else if (p === 'dmca') renderDMCA();
  else if (p === 'watchlist') renderWatchlist();
  else if (CAT_CFG[p]) renderCategory(p);
  else renderHome();
}

// ── BOOT ──
S.page = getPage();
renderPage();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

// Keep the backend warm while the tab is active, so downloads feel fast instead of waking from cold sleep.
setInterval(() => {
  if (document.visibilityState === 'visible') fetch(API_BASE + '/downloads/extract').catch(()=>{});
}, 4 * 60 * 1000);
</script>
