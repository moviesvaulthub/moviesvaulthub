<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoviesVault — Direct Downloads</title>
<style>
:root{--bg:#0a0c10;--surface:#13161d;--card:#1a1e28;--border:#252a36;--accent:#e63946;--text:#e8ecf0;--muted:#7a8394;--green:#2ec4b6;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.topbar{background:var(--accent);text-align:center;padding:7px;font-size:12px;font-weight:700;color:#fff;}
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:58px;}
.logo{font-size:26px;font-weight:bold;color:var(--accent);text-decoration:none;}
.nav-links{display:flex;gap:15px;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:12px;cursor:pointer;}
.nav-links a:hover,.nav-links a.active{color:var(--text);}
.section{padding:28px 16px;max-width:1280px;margin:0 auto;}
.section-title{font-size:24px;margin-bottom:16px;border-left:4px solid var(--accent);padding-left:12px;}
.movies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px;}
.movie-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border);transition:transform 0.2s;cursor:pointer;}
.movie-card:hover{transform:translateY(-5px);border-color:var(--accent);}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;}
.card-body{padding:8px 10px 10px;}
.card-title{font-weight:800;font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-year{font-size:11px;color:var(--muted);}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:14px;grid-column:1/-1;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-inner{background:var(--surface);border-radius:16px;max-width:480px;width:90%;overflow:hidden;border:1px solid var(--accent);}
.modal-close{position:fixed;top:16px;right:16px;background:var(--accent);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
.modal-body{padding:20px;text-align:center;}
.modal-title{font-size:24px;margin-bottom:12px;color:var(--accent);}
.btn-dl{display:block;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;text-decoration:none;text-align:center;margin-top:16px;cursor:pointer;}
.btn-dl:hover{opacity:0.9;}
footer{text-align:center;padding:20px;color:var(--muted);border-top:1px solid var(--border);margin-top:40px;font-size:12px;}
</style>
</head>
<body>

<div class="topbar">🔥 MoviesVault — Direct Download Links (No Redirects)</div>

<nav>
  <a class="logo" href="#">MoviesVault</a>
  <div class="nav-links">
    <a class="active" onclick="location.reload()">Home</a>
  </div>
</nav>

<div class="section">
  <div class="section-title">🎬 Latest Movies (Scraped)</div>
  <div id="movies-grid" class="movies-grid">
    <div class="loading"><div class="spinner"></div>Loading movies...</div>
  </div>
</div>

<div id="modal" class="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-inner">
    <div class="modal-body">
      <div class="modal-title" id="modalTitle">Movie Title</div>
      <div id="modalContent">Fetching download link...</div>
    </div>
  </div>
</div>

<footer>© 2025 MoviesVault – All download links are from public sources. For educational use only.</footer>

<script>
// ==================== SCRAPER CONFIGURATION ====================
const RSS2JSON = 'https://api.rss2json.com/v1/api.json';
const ALLORIGINS = 'https://api.allorigins.win/raw?url=';

// Fetch movie list from TheNkiri RSS feed
async function fetchMovieList() {
  const rssUrl = 'https://thenkiri.com/category/movies/feed/';
  const apiUrl = `${RSS2JSON}?rss_url=${encodeURIComponent(rssUrl)}`;
  try {
    const res = await fetch(apiUrl);
    const data = await res.json();
    if (!data.items) return [];
    return data.items.map(item => ({
      title: item.title,
      link: item.link,
      thumbnail: extractImage(item.content || item.description || ''),
      date: item.pubDate
    }));
  } catch (err) {
    console.error('Failed to fetch movie list', err);
    return [];
  }
}

function extractImage(html) {
  const match = html.match(/<img[^>]+src=["']([^"']+)/i);
  return match ? match[1] : null;
}

// Scrape download link from a single post
async function scrapeDownloadLink(postUrl) {
  const proxyUrl = ALLORIGINS + encodeURIComponent(postUrl);
  try {
    const res = await fetch(proxyUrl);
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    
    // Common patterns for file host links
    const selectors = [
      'a[href*="rapidgator"]', 'a[href*="uploadhub"]', 'a[href*="wella"]',
      'a[href*="mega.nz"]', 'a[href*="mediafire"]', 'a[href*="gdrive"]'
    ];
    for (let sel of selectors) {
      let elem = doc.querySelector(sel);
      if (elem && elem.href && !elem.href.includes('thenkiri.com')) {
        return elem.href;
      }
    }
    // Fallback: any external link that looks like a file
    let allLinks = doc.querySelectorAll('a');
    for (let link of allLinks) {
      let href = link.getAttribute('href');
      if (href && (href.includes('/download/') || href.includes('file=') || href.match(/\.(mkv|mp4|rar|zip)$/i))) {
        if (!href.includes('thenkiri.com')) return href;
      }
    }
    return null;
  } catch (err) {
    console.error('Scrape error', err);
    return null;
  }
}

// Render movies on page
async function loadMovies() {
  const grid = document.getElementById('movies-grid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching movie list...</div>';
  
  const movies = await fetchMovieList();
  if (movies.length === 0) {
    grid.innerHTML = '<div class="loading">No movies found. Please refresh.</div>';
    return;
  }
  
  grid.innerHTML = movies.map(movie => `
    <div class="movie-card" data-url="${movie.link}" data-title="${escapeHtml(movie.title)}">
      <img class="card-img" src="${movie.thumbnail || 'https://placehold.co/300x450/1a1e28/e63946?text=No+Image'}" 
           onerror="this.src='https://placehold.co/300x450/1a1e28/e63946?text=No+Image'">
      <div class="card-body">
        <div class="card-title">${escapeHtml(movie.title)}</div>
        <div class="card-year">${new Date(movie.date).getFullYear() || ''}</div>
      </div>
    </div>
  `).join('');
  
  // Attach click event to each card
  document.querySelectorAll('.movie-card').forEach(card => {
    card.addEventListener('click', () => {
      const postUrl = card.dataset.url;
      const title = card.dataset.title;
      openModalAndFetchLink(postUrl, title);
    });
  });
}

// Open modal, scrape download link, show button
async function openModalAndFetchLink(postUrl, title) {
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalContent = document.getElementById('modalContent');
  
  modalTitle.textContent = title;
  modalContent.innerHTML = '<div class="loading"><div class="spinner"></div>Searching for direct download link...</div>';
  modal.classList.add('active');
  
  const directLink = await scrapeDownloadLink(postUrl);
  if (directLink) {
    modalContent.innerHTML = `
      <p style="margin-bottom:16px;">✅ Direct download link found!</p>
      <a href="${directLink}" target="_blank" class="btn-dl">⬇ DOWNLOAD NOW</a>
      <p style="margin-top:16px; font-size:12px; color:#7a8394;">Link provided by external source.</p>
    `;
  } else {
    modalContent.innerHTML = `
      <p>❌ No download link found for "${escapeHtml(title)}".</p>
      <p>The post might not contain any file host links.</p>
      <button class="btn-dl" style="background:#555;" onclick="closeModal()">Close</button>
    `;
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Start the app
loadMovies();
</script>
</body>
</html>
