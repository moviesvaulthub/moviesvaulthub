<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoviesVault – Live Scraper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0c10; color: #e8ecf0; }
    .topbar { background: #e63946; text-align: center; padding: 8px; font-weight: bold; }
    nav { background: #13161d; padding: 15px 20px; border-bottom: 1px solid #252a36; }
    .logo { font-size: 24px; font-weight: bold; color: #e63946; text-decoration: none; }
    .section { padding: 30px 20px; max-width: 1300px; margin: 0 auto; }
    .section-title { font-size: 28px; margin-bottom: 20px; border-left: 5px solid #e63946; padding-left: 15px; }
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px; }
    .movie-card { background: #1a1e28; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid #252a36; transition: 0.2s; }
    .movie-card:hover { transform: translateY(-5px); border-color: #e63946; }
    .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
    .card-body { padding: 10px; }
    .card-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-year { font-size: 12px; color: #7a8394; }
    .search-box { margin: 20px 0; display: flex; gap: 10px; }
    .search-box input { flex: 1; padding: 12px; background: #1a1e28; border: 1px solid #252a36; color: white; border-radius: 8px; font-size: 14px; }
    .search-box button { padding: 12px 24px; background: #e63946; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    .loading { text-align: center; padding: 50px; color: #7a8394; grid-column: 1/-1; }
    .spinner { width: 40px; height: 40px; border: 4px solid #252a36; border-top-color: #e63946; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #13161d; max-width: 450px; width: 90%; border-radius: 16px; border: 1px solid #e63946; }
    .modal-header { padding: 15px; background: #1a1e28; display: flex; justify-content: space-between; border-bottom: 1px solid #252a36; }
    .modal-header h3 { color: #e63946; }
    .modal-body { padding: 25px; text-align: center; }
    .close-modal { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
    .btn-download { display: inline-block; background: #e63946; color: white; padding: 12px 25px; border-radius: 40px; text-decoration: none; font-weight: bold; margin-top: 20px; }
    footer { text-align: center; padding: 20px; color: #7a8394; border-top: 1px solid #252a36; margin-top: 40px; font-size: 12px; }
  </style>
</head>
<body>

<div class="topbar">🔥 MoviesVault – Live Scraper (Direct Download Links)</div>

<nav>
  <a class="logo" href="#">MoviesVault</a>
</nav>

<div class="section">
  <div class="section-title">🎬 Search Movies</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search for a movie (e.g., John Wick)">
    <button onclick="searchMovies()">Search</button>
    <button onclick="loadLatest()">Latest Movies</button>
  </div>
  <div id="moviesGrid" class="movies-grid">
    <div class="loading"><div class="spinner"></div>Loading latest movies...</div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Movie Title</h3>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>© 2025 MoviesVault – Scraped live from public sources. Educational use only.</footer>

<script>
  // ========== CONFIGURATION ==========
  // This calls your own backend API (which bypasses CORS)
  const PROXY = '/api/proxy?url=';
  const NKIRI_API = 'https://thenkiri.com/wp-json/wp/v2/posts';

  // Helper: fetch any URL via your backend
  async function fetchViaProxy(url) {
    const res = await fetch(PROXY + encodeURIComponent(url));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const contentType = res.headers.get('content-type');
    if (contentType && contentType.includes('application/json')) {
      return await res.json();
    } else {
      return await res.text();
    }
  }

  // Fetch movies from WordPress API (search or latest)
  async function fetchMovies(searchTerm = '') {
    let apiUrl = `${NKIRI_API}?per_page=24&_embed`;
    if (searchTerm) {
      apiUrl = `${NKIRI_API}?search=${encodeURIComponent(searchTerm)}&per_page=24&_embed`;
    }
    try {
      const data = await fetchViaProxy(apiUrl);
      if (!Array.isArray(data)) return [];
      return data.map(post => ({
        id: post.id,
        title: post.title.rendered,
        link: post.link,
        thumbnail: post._embedded?.['wp:featuredmedia']?.[0]?.source_url || null,
        date: post.date
      }));
    } catch (err) {
      console.error('Fetch error', err);
      return [];
    }
  }

  // Extract direct download link from post HTML
  async function extractDownloadLink(postUrl) {
    try {
      const html = await fetchViaProxy(postUrl);
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const selectors = [
        'a[href*="rapidgator"]', 'a[href*="uploadhub"]', 'a[href*="wella"]',
        'a[href*="mega.nz"]', 'a[href*="mediafire"]', 'a[href*="gdrive"]'
      ];
      for (let sel of selectors) {
        let elem = doc.querySelector(sel);
        if (elem && elem.href && !elem.href.includes('thenkiri.com')) {
          return elem.href;
        }
      }
      // Fallback: any external link with file extension or '/download/'
      let allLinks = doc.querySelectorAll('a');
      for (let link of allLinks) {
        let href = link.href;
        if (href && (href.includes('/download/') || href.includes('file=') || /\.(mkv|mp4|rar|zip)$/i.test(href))) {
          if (!href.includes('thenkiri.com')) return href;
        }
      }
      return null;
    } catch (err) {
      return null;
    }
  }

  // Render movie cards
  function renderMovies(movies) {
    const grid = document.getElementById('moviesGrid');
    if (!movies.length) {
      grid.innerHTML = '<div class="loading">❌ No movies found. Try another search.</div>';
      return;
    }
    grid.innerHTML = movies.map(movie => `
      <div class="movie-card" data-url="${movie.link}" data-title="${escapeHtml(movie.title)}">
        <img class="card-img" src="${movie.thumbnail || 'https://placehold.co/300x450/1a1e28/e63946?text=No+Image'}" 
             onerror="this.src='https://placehold.co/300x450/1a1e28/e63946?text=No+Image'">
        <div class="card-body">
          <div class="card-title">${escapeHtml(movie.title)}</div>
          <div class="card-year">${new Date(movie.date).getFullYear() || ''}</div>
        </div>
      </div>
    `).join('');
    
    // Attach click events
    document.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('click', async () => {
        const postUrl = card.dataset.url;
        const title = card.dataset.title;
        await showDownloadModal(title, postUrl);
      });
    });
  }

  async function showDownloadModal(title, postUrl) {
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    modalTitle.textContent = title;
    modalBody.innerHTML = '<div class="loading"><div class="spinner"></div>Searching for download link...</div>';
    modal.classList.add('active');
    
    const link = await extractDownloadLink(postUrl);
    if (link) {
      modalBody.innerHTML = `
        <p>✅ Direct download link found!</p>
        <a href="${link}" target="_blank" class="btn-download">⬇ DOWNLOAD NOW</a>
        <p style="margin-top:15px; font-size:12px;">You will be redirected to the file host.</p>
      `;
    } else {
      modalBody.innerHTML = `
        <p>❌ No download link found.</p>
        <button class="btn-download" style="background:#555;" onclick="closeModal()">Close</button>
      `;
    }
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  async function searchMovies() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    const grid = document.getElementById('moviesGrid');
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
    const movies = await fetchMovies(query);
    renderMovies(movies);
  }

  async function loadLatest() {
    const grid = document.getElementById('moviesGrid');
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading latest movies...</div>';
    const movies = await fetchMovies('');
    renderMovies(movies);
  }

  // Initial load
  loadLatest();
</script>
</body>
</html>
