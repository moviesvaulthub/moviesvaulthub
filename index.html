<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoviesVault – Live Movies (No Setup)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0a0c10;color:#e8ecf0;}
.topbar{background:#e63946;text-align:center;padding:8px;font-weight:bold;}
nav{background:#13161d;padding:12px 20px;border-bottom:1px solid #252a36;}
.logo{font-size:24px;font-weight:bold;color:#e63946;text-decoration:none;}
.movies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;padding:30px;}
.movie-card{background:#1a1e28;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #252a36;transition:0.2s;}
.movie-card:hover{transform:translateY(-5px);border-color:#e63946;}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;}
.card-body{padding:10px;}
.card-title{font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.loading{text-align:center;padding:50px;}
.spinner{width:40px;height:40px;border:4px solid #252a36;border-top-color:#e63946;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 15px;}
@keyframes spin{to{transform:rotate(360deg);}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;align-items:center;justify-content:center;}
.modal.active{display:flex;}
.modal-content{background:#13161d;max-width:450px;width:90%;border-radius:16px;border:1px solid #e63946;}
.modal-header{padding:15px;background:#1a1e28;display:flex;justify-content:space-between;}
.modal-body{padding:25px;text-align:center;}
.close-modal{background:none;border:none;color:white;font-size:24px;cursor:pointer;}
.btn-download{display:inline-block;background:#e63946;color:white;padding:12px 25px;border-radius:40px;text-decoration:none;margin-top:15px;}
footer{text-align:center;padding:20px;color:#7a8394;border-top:1px solid #252a36;margin-top:40px;font-size:12px;}
</style>
</head>
<body>

<div class="topbar">🔥 MoviesVault – Live Movie Scraper (No Setup Required)</div>
<nav><a class="logo" href="#">MoviesVault</a></nav>

<div class="movies-grid" id="moviesGrid">
  <div class="loading"><div class="spinner"></div>Loading movies...</div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Movie Title</h3>
      <button class="close-modal" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer>© 2025 MoviesVault – All download links are from public sources. For educational use.</footer>

<script>
// ========== FREE PUBLIC CORS PROXY – NO SETUP NEEDED ==========
const PROXY = 'https://cors-proxy.htmldriven.com/?url=';

async function fetchMovies() {
  const rssUrl = 'https://thenkiri.com/category/movies/feed/';
  const proxyUrl = PROXY + encodeURIComponent(rssUrl);
  const response = await fetch(proxyUrl);
  const text = await response.text();
  const parser = new DOMParser();
  const xml = parser.parseFromString(text, 'application/xml');
  const items = xml.querySelectorAll('item');
  const movies = [];
  items.forEach(item => {
    const title = item.querySelector('title')?.textContent || '';
    const link = item.querySelector('link')?.textContent || '';
    const description = item.querySelector('description')?.textContent || '';
    const thumbMatch = description.match(/<img[^>]+src="([^"]+)"/i);
    const thumbnail = thumbMatch ? thumbMatch[1] : null;
    movies.push({ title, link, thumbnail });
  });
  return movies.slice(0, 24);
}

async function getDownloadLink(postUrl) {
  const proxyUrl = PROXY + encodeURIComponent(postUrl);
  const html = await fetch(proxyUrl).then(r => r.text());
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const selectors = [
    'a[href*="rapidgator"]', 'a[href*="uploadhub"]', 'a[href*="wella"]',
    'a[href*="mega.nz"]', 'a[href*="mediafire"]'
  ];
  for (let sel of selectors) {
    let el = doc.querySelector(sel);
    if (el && el.href && !el.href.includes('thenkiri.com')) {
      return el.href;
    }
  }
  let links = doc.querySelectorAll('a');
  for (let link of links) {
    let href = link.href;
    if (href && (href.includes('/download/') || href.match(/\.(mkv|mp4|rar|zip)$/i))) {
      if (!href.includes('thenkiri.com')) return href;
    }
  }
  return null;
}

async function loadMovies() {
  const grid = document.getElementById('moviesGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>Fetching latest movies...</div>';
  const movies = await fetchMovies();
  if (!movies.length) {
    grid.innerHTML = '<div class="loading">No movies found. Proxy may be slow. Refresh.</div>';
    return;
  }
  grid.innerHTML = movies.map(movie => `
    <div class="movie-card" data-url="${movie.link}" data-title="${escapeHtml(movie.title)}">
      <img class="card-img" src="${movie.thumbnail || 'https://placehold.co/300x450/1a1e28/e63946?text=No+Image'}" onerror="this.src='https://placehold.co/300x450/1a1e28/e63946?text=No+Image'">
      <div class="card-body">
        <div class="card-title">${escapeHtml(movie.title)}</div>
      </div>
    </div>
  `).join('');
  document.querySelectorAll('.movie-card').forEach(card => {
    card.addEventListener('click', async () => {
      const url = card.dataset.url;
      const title = card.dataset.title;
      await showDownloadModal(title, url);
    });
  });
}

async function showDownloadModal(title, postUrl) {
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  modalTitle.textContent = title;
  modalBody.innerHTML = '<div class="loading"><div class="spinner"></div>Searching for download link...</div>';
  modal.classList.add('active');
  
  const link = await getDownloadLink(postUrl);
  if (link) {
    modalBody.innerHTML = `
      <p>✅ Download link found!</p>
      <a href="${link}" target="_blank" class="btn-download">⬇ DOWNLOAD NOW</a>
      <p style="margin-top:15px; font-size:12px;">You will be redirected to the file host.</p>
    `;
  } else {
    modalBody.innerHTML = `
      <p>❌ No download link found.</p>
      <button class="btn-download" style="background:#555;" onclick="closeModal()">Close</button>
    `;
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
}

loadMovies();
</script>
</body>
</html>
