<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoviesVault — Cinema in Your Pocket</title>
  <meta name="description" content="MoviesVault — stream and download the latest Hollywood, Nollywood, Bollywood, K-Drama and TV series titles. Cinema in your pocket." />
  <meta property="og:title" content="MoviesVault — Cinema in Your Pocket" />
  <meta property="og:description" content="Stream and download the latest movies and series across Hollywood, Nollywood, Bollywood, K-Drama and more." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://moviesvaulthub.vercel.app" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MoviesVault — Cinema in Your Pocket" />
  <meta name="twitter:description" content="Stream and download the latest movies and series across Hollywood, Nollywood, Bollywood, K-Drama and more." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0c10'/%3E%3Ctext x='32' y='42' font-family='Arial, sans-serif' font-weight='800' font-size='28' fill='%23e63946' text-anchor='middle'%3EMV%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            bebas: ['"Bebas Neue"', 'cursive'],
            sans: ['Nunito', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    :root { --primary: #e63946; --bg: #0a0c10; --card: #12151b; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: #f1f5f9; font-family: 'Nunito', sans-serif; margin: 0; }

    /* Marquee */
    @keyframes marquee { 0%{ transform:translateX(0) } 100%{ transform:translateX(-50%) } }
    .marquee { animation: marquee 40s linear infinite; }

    /* Scrollbar */
    .hide-sb::-webkit-scrollbar { display: none; }
    .hide-sb { -ms-overflow-style:none; scrollbar-width:none; }
    .thin-sb::-webkit-scrollbar { width: 4px; }
    .thin-sb::-webkit-scrollbar-track { background: transparent; }
    .thin-sb::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Hero carousel */
    .hero-track { display:flex; transition: transform 0.65s cubic-bezier(0.25,0.46,0.45,0.94); }

    /* Movie card */
    .mcard:hover .mcard-overlay { opacity: 1; }
    .mcard:hover .mcard-play   { transform: translateY(0); }
    .mcard:hover .mcard-img    { transform: scale(1.1); }
    .mcard-overlay { opacity:0; transition: opacity 0.3s; }
    .mcard-img     { transition: transform 0.5s; }
    .mcard-play    { transform: translateY(16px); transition: transform 0.3s; }

    /* Modal */
    @keyframes fadeIn  { from{opacity:0}           to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px) scale(.96)} to{opacity:1;transform:translateY(0) scale(1)} }
    .modal-bd   { animation: fadeIn  0.2s ease; }
    .modal-box  { animation: slideUp 0.3s ease; }

    /* Spinner */
    @keyframes spin { to{ transform:rotate(360deg) } }
    .spinner { animation: spin 1s linear infinite; }

    /* Download card hover sweep */
    .dlcard { position: relative; overflow: hidden; }
    .dlcard::before { content:''; position:absolute; inset:0; background:rgba(230,57,70,0.05); transform:translateY(101%); transition:transform 0.28s ease-out; border-radius: inherit; pointer-events:none; }
    .dlcard:hover::before { transform: translateY(0); }

    /* Genre cards */
    .genre-card:hover .genre-icon { transform: scale(1.15); }
    .genre-icon { transition: transform 0.3s; }

    /* Tab underline */
    .modal-tab.active    { color:var(--primary); border-bottom-color:var(--primary); }
    .modal-tab           { border-bottom: 2px solid transparent; }
  </style>
</head>
<body>
  <div id="app">
    <div id="nav-wrap"></div>
    <div id="page" class="min-h-screen"></div>
    <div id="footer-wrap"></div>
    <div id="modal-wrap"></div>
  </div>

<script>
// ───────────────────────────────────────────────────────────────
// CONFIG
// ───────────────────────────────────────────────────────────────
const TMDB_KEY  = '8265bd1679663a7ea12ac168da84d2e8';
const TMDB      = 'https://api.themoviedb.org/3';
const IMG_P     = 'https://image.tmdb.org/t/p/w300';
const IMG_B     = 'https://image.tmdb.org/t/p/w780';
// API base: pointed at the Replit backend.
window.MV_API = 'https://interface-enhancer--moviesvault001.replit.app/api';
const API_BASE  = window.MV_API || '/api';

// ───────────────────────────────────────────────────────────────
// STATE
// ───────────────────────────────────────────────────────────────
const S = {
  page: 'home',
  scrolled: false,
  searchOpen: false,
  searchQ: '',
  mobileOpen: false,
  heroIdx: 0,
  heroMovies: [],
  heroTimer: null,
  modal: null,
  modalTab: 'info',
  modalDetails: null,
  modalVideos: null,
  dlLoading: false,
  dlResult: null,
  dlCommitted: '',
  dlInput: '',
  watchlist: JSON.parse(localStorage.getItem('mv_wl') || '[]'),
  catConfig: null,
  catPage: 1,
  catTab: null,
  catData: null,
  trendTab: 'movies',
  trendMovies: [],
  trendTv: [],
  topRated: [],
};

// ───────────────────────────────────────────────────────────────
// MOVIE REGISTRY — avoids serialising objects in onclick attrs
// ───────────────────────────────────────────────────────────────
const MOVIES = new Map();
function reg(m) { if (m?.id) MOVIES.set(m.id, m); return m; }
function openById(id) { const m = MOVIES.get(+id); if (m) openModal(m); }

// ───────────────────────────────────────────────────────────────
// CACHE + FETCH
// ───────────────────────────────────────────────────────────────
const CACHE = new Map();
function tmdb(path, params = {}) {
  const u = new URL(`${TMDB}${path}`);
  u.searchParams.set('api_key', TMDB_KEY);
  for (const [k,v] of Object.entries(params)) if (v !== undefined && v !== '') u.searchParams.set(k, String(v));
  const key = u.toString();
  if (!CACHE.has(key)) CACHE.set(key, fetch(key).then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); }));
  return CACHE.get(key);
}

async function extractLinks(title, year) {
  const u = new URL(`${API_BASE}/downloads/extract`, location.origin.startsWith('file') ? 'http://localhost' : location.origin);
  if (title) u.searchParams.set('title', title);
  if (year)  u.searchParams.set('year', year);
  const r = await fetch(u.toString());
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

// ───────────────────────────────────────────────────────────────
// ICONS (inline SVG — no external dependency)
// ───────────────────────────────────────────────────────────────
const ICO = {
  play:     `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
  info:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  star:     `<svg viewBox="0 0 24 24" fill="currentColor" style="color:#eab308"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  dl:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  x:        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  menu:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>`,
  search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  film:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>`,
  clock:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  cal:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  bm:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  bmFill:   `<svg viewBox="0 0 24 24" fill="currentColor" style="color:#e63946"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  ext:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  refresh:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  flame:    `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
  chevL:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>`,
  chevR:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`,
  users:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  shield:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>`,
};
function ico(name, cls='w-5 h-5') { return `<span class="inline-flex items-center justify-center ${cls}" style="width:1em;height:1em;min-width:${cls.includes('w-6')?'24':cls.includes('w-8')?'32':cls.includes('w-12')?'48':cls.includes('w-3')?'12':cls.includes('w-4')?'16':'20'}px;min-height:${cls.includes('h-6')?'24':cls.includes('h-8')?'32':cls.includes('h-12')?'48':cls.includes('h-3')?'12':cls.includes('h-4')?'16':'20'}px">${ICO[name]}</span>`; }

// ───────────────────────────────────────────────────────────────
// HTML ESCAPE
// ───────────────────────────────────────────────────────────────
function h(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ───────────────────────────────────────────────────────────────
// ROUTER
// ───────────────────────────────────────────────────────────────
const PAGES = { '':'home','home':'home','hollywood':'hollywood','nollywood':'nollywood','bollywood':'bollywood','series':'series','kdrama':'kdrama','about':'about','privacy':'privacy','dmca':'dmca',
  'genre-action':'genre-action','genre-comedy':'genre-comedy','genre-horror':'genre-horror','genre-romance':'genre-romance','genre-scifi':'genre-scifi','genre-thriller':'genre-thriller' };
function getPage() { return PAGES[location.hash.replace(/^#\/?/,'')]||'home'; }
window.addEventListener('hashchange', () => { S.page = getPage(); renderPage(); window.scrollTo(0,0); });

// ───────────────────────────────────────────────────────────────
// WATCHLIST
// ───────────────────────────────────────────────────────────────
const inWL = id => S.watchlist.includes(+id);
function toggleWL(id) {
  id = +id;
  S.watchlist = inWL(id) ? S.watchlist.filter(i=>i!==id) : [...S.watchlist, id];
  localStorage.setItem('mv_wl', JSON.stringify(S.watchlist));
}

// ───────────────────────────────────────────────────────────────
// SEARCH (debounced)
// ───────────────────────────────────────────────────────────────
let _st = null, _sr = [];
function doSearch(q) {
  clearTimeout(_st);
  if (!q || q.length < 3) { _sr = []; drawNav(); return; }
  _st = setTimeout(async () => {
    try {
      const d = await tmdb('/search/multi', { query: q, include_adult: 'false' });
      _sr = (d.results||[]).slice(0,6).map(reg);
      drawNav();
    } catch { _sr = []; }
  }, 350);
}

// ───────────────────────────────────────────────────────────────
// NAVBAR
// ───────────────────────────────────────────────────────────────
const NAV_LINKS = [
  {name:'Home',       hash:'#home'},
  {name:'Hollywood',  hash:'#hollywood'},
  {name:'Nollywood',  hash:'#nollywood'},
  {name:'Bollywood',  hash:'#bollywood'},
  {name:'Series',     hash:'#series'},
  {name:'K-Drama',    hash:'#kdrama'},
];
const PAGE_OF = {home:'home',hollywood:'hollywood',nollywood:'nollywood',bollywood:'bollywood',series:'series',kdrama:'kdrama'};

function drawNav() {
  const p = S.page;
  document.getElementById('nav-wrap').innerHTML = `
    <nav class="fixed top-0 w-full z-40 transition-all duration-300 ${S.scrolled?'bg-[#0a0c10]/95 backdrop-blur-md shadow-lg py-3':'bg-transparent py-5'}">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between">
          <a href="#home" class="flex items-center gap-2 group">
            <div class="bg-[#e63946] p-1.5 rounded-lg group-hover:scale-110 transition-transform text-white">${ICO.film}</div>
            <span class="font-bebas text-3xl tracking-wider text-white">MOVIES<span style="color:#e63946">VAULT</span></span>
          </a>
          <div class="hidden md:flex items-center gap-8">
            ${NAV_LINKS.map(l=>`<a href="${l.hash}" class="text-sm font-semibold uppercase tracking-wider transition-colors hover:text-[#e63946] ${(PAGE_OF[p]||p)===l.hash.replace('#','') ? 'text-[#e63946]':'text-white/70'}">${l.name}</a>`).join('')}
          </div>
          <div class="flex items-center gap-4">
            <div class="relative">
              <button onclick="toggleSearch()" class="p-2 text-white/70 hover:text-white transition-colors flex">${ICO.search}</button>
              ${S.searchOpen ? `
                <div class="absolute top-full right-0 mt-2 w-72 bg-[#12151b] border border-white/10 rounded-lg shadow-xl overflow-hidden z-50">
                  <input id="si" type="text" placeholder="Search movies, series…" value="${h(S.searchQ)}" autocomplete="off"
                    class="w-full bg-transparent border-b border-white/10 p-3 text-sm text-white focus:outline-none placeholder:text-gray-500"
                    style="border-bottom-color:${S.searchQ.length>0?'#e63946':'rgba(255,255,255,0.1)'}"
                  />
                  <div class="max-h-96 overflow-y-auto">
                    ${S.searchQ.length < 3 ? '' : _sr.length===0
                      ? '<p class="p-4 text-center text-gray-400 text-sm">No results found.</p>'
                      : _sr.map(r=>`
                          <button onclick="openById(${r.id})" class="w-full text-left p-3 hover:bg-white/5 transition-colors flex gap-3 items-start">
                            ${r.poster_path ? `<img src="https://image.tmdb.org/t/p/w92${r.poster_path}" class="w-10 h-14 object-cover rounded flex-shrink-0" loading="lazy" />`:`<div class="w-10 h-14 bg-gray-800 rounded flex-shrink-0"></div>`}
                            <div>
                              <p class="text-sm font-bold text-white line-clamp-1">${h(r.title||r.name)}</p>
                              <p class="text-xs text-gray-400">${(r.release_date||r.first_air_date||'').substring(0,4)}</p>
                            </div>
                          </button>`).join('')
                    }
                  </div>
                </div>` : ''}
            </div>
            <button onclick="toggleMobile()" class="md:hidden p-2 text-white/70 hover:text-white flex">${ICO.menu}</button>
          </div>
        </div>
      </div>
    </nav>
    ${S.mobileOpen ? `
      <div class="fixed inset-0 z-50 bg-[#0a0c10]/95 backdrop-blur-xl flex flex-col p-6 md:hidden">
        <div class="flex justify-between items-center mb-12">
          <a href="#home" onclick="toggleMobile()" class="flex items-center gap-2">
            <div class="bg-[#e63946] p-1.5 rounded-lg text-white">${ICO.film}</div>
            <span class="font-bebas text-3xl tracking-wider text-white">MOVIES<span style="color:#e63946">VAULT</span></span>
          </a>
          <button onclick="toggleMobile()" class="p-2 text-white/70 flex">${ICO.x}</button>
        </div>
        <div class="flex flex-col gap-6">
          ${NAV_LINKS.map(l=>`<a href="${l.hash}" onclick="toggleMobile()" class="text-2xl font-bebas tracking-wider ${(PAGE_OF[p]||p)===l.hash.replace('#','')?'text-[#e63946]':'text-white'}">${l.name}</a>`).join('')}
          <a href="#about" onclick="toggleMobile()" class="text-2xl font-bebas tracking-wider text-white/50 hover:text-white mt-4 pt-4 border-t border-white/10">ABOUT & CONTACT</a>
        </div>
      </div>` : ''}
  `;
  const si = document.getElementById('si');
  if (si) {
    si.addEventListener('input', e => { S.searchQ = e.target.value; doSearch(S.searchQ); });
    si.addEventListener('keydown', e => { if (e.key==='Escape'){ S.searchOpen=false; S.searchQ=''; _sr=[]; drawNav(); } });
    si.focus();
  }
}

// ───────────────────────────────────────────────────────────────
// HERO CAROUSEL
// ───────────────────────────────────────────────────────────────
async function renderHero(el) {
  el.innerHTML = `<div class="w-full h-[70vh] sm:h-[80vh] md:h-[90vh] bg-[#12151b] animate-pulse rounded"></div>`;
  try {
    const d = await tmdb('/trending/all/day');
    const movies = (d.results||[]).slice(0,5).map(reg);
    S.heroMovies = movies; S.heroIdx = 0;
    if (!movies.length) { el.innerHTML=''; return; }
    el.innerHTML = `
      <div class="relative w-full h-[70vh] sm:h-[80vh] md:h-[90vh] overflow-hidden">
        <div id="hero-track" class="hero-track h-full" style="width:${movies.length*100}%">
          ${movies.map((m,i)=>{
            const title = m.title||m.name||'Unknown';
            return `
              <div class="relative h-full" style="width:${100/movies.length}%">
                <img src="${IMG_B}${m.backdrop_path}" alt="${h(title)}" class="absolute inset-0 w-full h-full object-cover object-top" loading="${i===0?'eager':'lazy'}" />
                <div class="absolute inset-0 bg-gradient-to-r from-[#0a0c10] via-[#0a0c10]/60 to-transparent"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#0a0c10] via-[#0a0c10]/20 to-transparent"></div>
                <div class="absolute inset-0 flex items-center">
                  <div class="container mx-auto px-4 sm:px-6 lg:px-8 mt-20">
                    <div class="max-w-2xl">
                      <div class="flex items-center gap-3 mb-4">
                        <span class="bg-[#e63946] text-white text-xs font-bold px-2 py-1 rounded">${m.media_type==='tv'?'SERIES':'MOVIE'}</span>
                        <div class="flex items-center gap-1 text-sm font-bold" style="color:#eab308">
                          <span class="w-4 h-4 inline-flex">${ICO.star}</span> ${(m.vote_average||0).toFixed(1)}
                        </div>
                      </div>
                      <h1 class="text-5xl sm:text-7xl md:text-8xl font-bebas text-white leading-none tracking-wide mb-4 drop-shadow-lg">${h(title)}</h1>
                      <p class="text-white/70 text-lg md:text-xl mb-8 max-w-xl" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${h(m.overview||'')}</p>
                      <div class="flex flex-wrap items-center gap-4">
                        <button onclick="openById(${m.id})" class="flex items-center gap-3 font-bebas text-2xl px-8 py-4 rounded text-white transition-transform hover:scale-105" style="background:#e63946">
                          <span class="w-6 h-6 inline-flex">${ICO.play}</span> Stream Now
                        </button>
                        <button onclick="openById(${m.id})" class="flex items-center gap-3 font-bebas text-2xl px-8 py-4 rounded text-white transition-colors hover:bg-white/20" style="background:rgba(255,255,255,0.1)">
                          <span class="w-6 h-6 inline-flex">${ICO.info}</span> Details
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
        <!-- Dots -->
        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-2 z-10" id="hero-dots">
          ${movies.map((_,i)=>`<button onclick="heroGo(${i})" id="hd${i}" class="h-2 rounded-full transition-all ${i===0?'bg-[#e63946] w-6':'bg-white/30 w-2'}"></button>`).join('')}
        </div>
        <!-- Arrows -->

async function openModal(m) {
  S.modal = m; S.modalTab = 'info'; S.modalDetails = null; S.modalVideos = null;
  S.dlLoading = false; S.dlResult = null; S.dlCommitted = ''; S.dlInput = '';
  document.body.style.overflow = 'hidden';
  drawModal();
  const type = m.media_type==='tv'||!m.title ? 'tv' : 'movie';
  try {
    const [det, vid] = await Promise.all([tmdb(`/${type}/${m.id}`), tmdb(`/${type}/${m.id}/videos`)]);
    if (S.modal?.id === m.id) { S.modalDetails = det; S.modalVideos = vid; drawModal(); }
  } catch {}
}

function closeModal() {
  S.modal = null; S.modalDetails = null; S.modalVideos = null; S.dlResult = null;
  document.body.style.overflow = '';
  document.getElementById('modal-wrap').innerHTML = '';
  restartAutoplay();
}

function setTab(t) {
  S.modalTab = t;
  if (t==='download' && !S.dlResult && !S.dlLoading) fetchDL();
  drawModal();
}

async function fetchDL() {
  if (!S.modal) return;
  S.dlLoading = true; drawModal();
  const title = S.dlCommitted || S.modal.title || S.modal.name || '';
  const year  = (S.modal.release_date||S.modal.first_air_date||'').split('-')[0];
  try { S.dlResult = await extractLinks(title, year); }
  catch { S.dlResult = { links:[], found:false }; }
  S.dlLoading = false; drawModal();
}

function retryDL()   { S.dlResult=null; fetchDL(); }
function commitDL()  { S.dlCommitted = S.dlInput.trim() || (S.modal?.title||S.modal?.name||''); S.dlResult=null; fetchDL(); }

        </section>

        <section>
          <h2 class="font-bebas text-4xl text-white mb-6">TRENDING NOW</h2>
          <div class="flex gap-2 mb-6" id="trend-tabs">
            ${['movies','series','toprated'].map((t,i)=>`
              <button onclick="setTrendTab('${t}')" data-tab="${t}"
                class="trend-tab px-4 py-2 rounded-full font-semibold text-sm transition-colors ${i===0?'text-white':'text-white/70 hover:bg-white/20'}"
                style="${i===0?'background:#e63946':'background:rgba(255,255,255,0.1)'}">
                ${t==='movies'?'Movies':t==='series'?'TV Series':'Top Rated'}
              </button>`).join('')}
          </div>
          <div id="trend-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">${skels(12)}</div>

  renderHero(document.getElementById('hero-el'));

    tmdb('/trending/movie/week'),
    tmdb('/trending/tv/week'),
    tmdb('/movie/top_rated'),
    tmdb('/discover/movie', { primary_release_year:'2025', sort_by:'popularity.desc' }),
  ]);

  S.trendMovies = (trmov?.results||[]).map(reg);
  S.trendTv     = (trtv?.results||[]).map(reg);
  S.topRated    = (topR?.results||[]).map(reg);

  const top10el = document.getElementById('top10');
  if (top10el) top10el.innerHTML = S.trendMovies.slice(0,10).map((m,i)=>`<div style="flex-shrink:0;width:180px;scroll-snap-align:start">${card(m,i,true)}</div>`).join('');

  const nrel = document.getElementById('newrel');
  if (nrel) nrel.innerHTML = (newR?.results||[]).slice(0,12).map(reg).map(m=>card(m)).join('');

function setTrendTab(t) {
  S.trendTab = t;
  document.querySelectorAll('.trend-tab').forEach(b=>{
    const a = b.dataset.tab===t;
    b.style.background = a ? '#e63946' : 'rgba(255,255,255,0.1)';
    b.style.color = a ? '#fff' : 'rgba(255,255,255,0.7)';
  });
  drawTrendGrid();
}

function drawTrendGrid() {
  const el = document.getElementById('trend-grid'); if (!el) return;
  const items = S.trendTab==='movies' ? S.trendMovies : S.trendTab==='series' ? S.trendTv : S.topRated;
  el.innerHTML = items.slice(0,12).map(m=>card(m)).join('');
}

const CAT_CFG = {
  hollywood: { title:'HOLLYWOOD',  type:'movie', region:'US',   tabs:['popular','new','top'] },
  nollywood: { title:'NOLLYWOOD',  type:'movie', query:'nollywood nigeria' },
  bollywood: { title:'BOLLYWOOD',  type:'movie', language:'hi', tabs:['popular','new','top'] },
  series:    { title:'TV SERIES',  type:'tv',                   tabs:['popular','action','comedy','drama'] },

};
const TAB_LBL = { popular:'Popular',new:'Latest',top:'Top Rated',action:'Action',comedy:'Comedy',drama:'Drama',korean:'K-Drama',chinese:'Chinese',thai:'Thai' };

async function renderCategory(page) {
  const cfg = CAT_CFG[page]; if (!cfg) return;
  S.catConfig = cfg; S.catPage = 1; S.catTab = cfg.tabs?.[0]||null;

  document.getElementById('page').innerHTML = `
    <div class="pt-32 pb-20 container mx-auto px-4 sm:px-6 lg:px-8 min-h-screen">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-10">
        <div>
          <h1 class="font-bebas text-5xl md:text-7xl text-white tracking-wide">${cfg.title}</h1>
          <p class="text-gray-400 mt-2">Explore the best of ${cfg.title.toLowerCase()} cinema.</p>
        </div>
        ${cfg.tabs ? `<div class="flex flex-wrap gap-2" id="cat-tabs">
          ${cfg.tabs.map((t,i)=>`<button onclick="setCatTab('${t}')" data-tab="${t}"
            class="cat-tab px-4 py-2 rounded-full font-semibold text-sm transition-colors ${i===0?'text-white':'text-white/70'}"
            style="${i===0?'background:#e63946':'background:rgba(255,255,255,0.1)'}">
            ${TAB_LBL[t]||t}</button>`).join('')}
        </div>` : ''}
      </div>
      <div id="cat-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-6">${skels(18)}</div>
      <div id="cat-pag" class="hidden flex justify-center mt-12 gap-4">
        <button onclick="doCatPage(-1)" id="cat-prev" class="px-6 py-2 rounded font-semibold transition-colors hover:bg-white/10" style="background:#12151b">Previous</button>
        <span id="cat-pg-info" class="flex items-center px-4 font-bold"></span>
        <button onclick="doCatPage(1)"  id="cat-next" class="px-6 py-2 rounded font-semibold text-white transition-colors hover:opacity-90" style="background:#e63946">Next</button>
      </div>
    </div>`;

  await loadCat();
}

async function loadCat() {
  const cfg = S.catConfig; if (!cfg) return;
  const grid = document.getElementById('cat-grid'); if (!grid) return;
  grid.innerHTML = skels(18);

  let data;
  if (cfg.query) {
    data = await tmdb('/search/multi', { query: cfg.query, include_adult:'false' });
  } else {
    const p = { page: String(S.catPage) };
    const t = S.catTab;
    if (cfg.language && !['korean','chinese','thai'].includes(t)) p.with_original_language = cfg.language;
    if (cfg.region) p.region = cfg.region;
    if (t==='popular')  p.sort_by = 'popularity.desc';
    if (t==='new')    { p.sort_by = 'primary_release_date.desc'; p['primary_release_date.lte'] = new Date().toISOString().split('T')[0]; }
    if (t==='top')    { p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = '100'; }
    if (t==='action')   p.with_genres = '10759';
    if (t==='comedy')   p.with_genres = '35';
    if (t==='drama')    p.with_genres = '18';
    if (t==='korean')   p.with_original_language = 'ko';
    if (t==='chinese')  p.with_original_language = 'zh';
    if (t==='thai')     p.with_original_language = 'th';
    if (cfg.genreId)    { p.with_genres = cfg.genreId; p.sort_by = 'popularity.desc'; }
    data = await tmdb(`/discover/${cfg.type}`, p);
  }

  S.catData = data;
  const results = (data?.results||[]).map(reg);
  if (!grid) return;
  grid.innerHTML = results.length ? results.map(m=>card(m)).join('') : '<div class="col-span-full text-center py-20 text-gray-400">No titles found.</div>';

  const pag = document.getElementById('cat-pag');
  if (data?.total_pages > 1 && !cfg.query) {
    pag?.classList.remove('hidden');
    pag?.classList.add('flex');
    const max = Math.min(data.total_pages, 500);
    const info = document.getElementById('cat-pg-info'); if (info) info.textContent = `Page ${S.catPage} of ${max}`;
    const prev = document.getElementById('cat-prev'); if (prev) prev.disabled = S.catPage===1;
    const next = document.getElementById('cat-next'); if (next) next.disabled = S.catPage>=max;
  } else {
    pag?.classList.add('hidden');
  }
}

function setCatTab(t) {
  S.catTab = t; S.catPage = 1;
  document.querySelectorAll('.cat-tab').forEach(b=>{
    const a = b.dataset.tab===t;
    b.style.background = a ? '#e63946' : 'rgba(255,255,255,0.1)';
    b.style.color = a ? '#fff' : 'rgba(255,255,255,0.7)';
  });
  loadCat();
}

function doCatPage(dir) {
  const max = Math.min(S.catData?.total_pages||1, 500);
  S.catPage = Math.max(1, Math.min(max, S.catPage+dir));
  loadCat(); window.scrollTo(0,0);
}

// ───────────────────────────────────────────────────────────────
// GLOBAL ACTIONS
// ───────────────────────────────────────────────────────────────
function toggleSearch() {
  S.searchOpen = !S.searchOpen;
  if (!S.searchOpen) { S.searchQ = ''; _sr = []; }
  drawNav();
}
function toggleMobile() { S.mobileOpen = !S.mobileOpen; drawNav(); }

// Close search clicking outside navbar
document.addEventListener('click', e => {
  if (!e.target.closest('#nav-wrap') && S.searchOpen) {
    S.searchOpen = false; S.searchQ = ''; _sr = [];
    drawNav();
  }
  if (!e.target.closest('#nav-wrap') && S.mobileOpen) {
    S.mobileOpen = false; drawNav();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modal) closeModal();
    else if (S.searchOpen) { S.searchOpen=false; S.searchQ=''; _sr=[]; drawNav(); }
  }
});

window.addEventListener('scroll', () => {
  const sc = window.scrollY > 50;
  if (sc !== S.scrolled) { S.scrolled = sc; drawNav(); }
});

// ───────────────────────────────────────────────────────────────
// EXPOSE GLOBALS (used from inline onclick)
// ───────────────────────────────────────────────────────────────
Object.assign(window, {
  openById, openModal, closeModal, setTab, handleWL, retryDL, commitDL,
  toggleSearch, toggleMobile, heroGo, heroNav,
  setTrendTab, setCatTab, doCatPage,
  S, // for dl input oninput
});

// ───────────────────────────────────────────────────────────────
// RENDER ENGINE
// ───────────────────────────────────────────────────────────────
function renderPage() {
  clearInterval(S.heroTimer);
  drawNav();
  renderFooter();
  const p = S.page;
  if (p === 'home')   renderHome();
  else if (p === 'about') renderAbout();
  else if (p === 'privacy') renderPrivacy();
  else if (p === 'dmca') renderDMCA();
  else if (CAT_CFG[p]) renderCategory(p);
  else renderHome();
}

// ── BOOT ──
S.page = getPage();
renderPage();
</script>
